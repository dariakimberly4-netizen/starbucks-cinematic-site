<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eadf" />
  <meta name="description" content="A cinematic Starbucks-inspired demo experience." />
  <title>Starbucks Cinematic Experience</title>
  <link rel="preconnect" href="https://about.starbucks.com" />
  <link rel="stylesheet" href="./css/global.css?v=cinematic6" />
  <link rel="stylesheet" href="./css/motion.css?v=cinematic5" />

  <style>
    @media (max-width: 780px) {
      .hero{display:block!important;min-height:auto!important;overflow:visible!important;background:#f3eadf!important}
      .hero-media{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;min-height:0!important;overflow:hidden!important}
      .hero-image{display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;object-fit:contain!important;object-position:center center!important;transform:none!important;animation:none!important}
      .hero-light,.hero-vignette,.scroll-cue{display:none!important}
      .hero-copy{position:relative!important;width:100%!important;min-height:auto!important;margin:0!important;padding:30px 22px 42px!important;align-items:flex-start!important;text-align:left!important;background:#f3eadf!important;transform:none!important;opacity:1!important}
      .hero-copy>*{width:100%!important;max-width:560px!important}
      .hero h1{max-width:8ch!important;margin:0!important;font-size:clamp(2.8rem,14vw,4.2rem)!important;line-height:.92!important}
      .hero-subtitle{margin-top:20px!important;max-width:30ch!important}
      .hero-actions{width:100%!important;margin-top:28px!important;display:grid!important;grid-template-columns:1fr!important;gap:12px!important}
      .hero-actions .button{width:100%!important;min-height:54px!important}
    }
  </style>

  
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <a class="brand" href="./" aria-label="Home">STARBUCKS</a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
      <span></span><span></span><span></span>
      <span class="sr-only">Open navigation</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
      <a class="active" href="./">Home</a>
      <a href="#menu" data-future-page="Menu Orbit">Menu</a>
      <a href="#rewards" data-future-page="Rewards">Rewards</a>
      <a href="#about" data-future-page="About Us">About Us</a>
      <a href="#stores" data-future-page="Stores">Stores</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title" data-hero>
      <div class="hero-media" aria-hidden="true">
        <img
          class="hero-image"
          data-hero-image
          src="./assets/images/home/FY27-Autumn_Starbucks-Stories_Header-1024x606.webp"
          alt=""
          decoding="async"
          fetchpriority="high"
        />
        <div class="hero-light" data-hero-light></div>
        <div class="hero-vignette"></div>
      </div>

      <div class="hero-copy" data-hero-copy>
        <h1 id="hero-title" class="reveal">IT STARTS WITH COFFEE.</h1>
        <p class="hero-subtitle reveal">Crafted with care.<br />Shared through connection.</p>

        <div class="hero-actions reveal">
          <button class="button button-primary" type="button" data-future-page="Menu Orbit">Explore Menu</button>
          <button class="button button-ghost" type="button" data-future-page="About Us">Our Story</button>
        </div>
      </div>

      <div class="scroll-cue" aria-hidden="true">
        <span>Scroll</span>
        <i></i>
      </div>
    </section>

    <section class="cinematic-bridge" aria-label="Cinematic transition">
      <div class="bridge-glow" aria-hidden="true"></div>
      <p>CRAFT · CONNECTION · STORY</p>
    </section>
  </main>

  <div class="film-grain" aria-hidden="true"></div>

  <div class="future-toast" role="status" aria-live="polite" data-toast></div>

  <script src="./js/navigation.js?v=20260919-mobilefix4"></script>
  <script src="./js/motion.js?v=cinematic6"></script>
</body>
</html>
